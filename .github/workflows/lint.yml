name: lint selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lint.py self-test
        run: python3 -I scripts/lint.py --selftest
      - name: Lint the clean demo sample
        run: python3 -I scripts/lint.py assets/demo-after.txt
