name: Suggest a new writing-habit rule
description: Propose a phrasing habit common in AI-generated prose to add to the rulebook.
labels: ["enhancement", "rules"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Ultimate Humanizer!
  - type: input
    id: pattern
    attributes:
      label: Banned Phrase or Pattern
      description: What is the specific word, phrase, or construction?
      placeholder: e.g. "beacon of hope", "in essence"
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why is this a common AI-writing habit?
      description: Cite evidence, model tendencies, or frequency in LLM output. Also say whether human writers use it, since the linter cannot tell who wrote a text.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Example Sentence(s)
      description: Provide before/after or real-world occurrences.
    validations:
      required: true
