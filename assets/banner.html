<!doctype html>
<!-- Source for banner.png (1280x320) and social-preview.png (1280x640).
     Export: msedge --headless --screenshot=out.png --window-size=1280,640 banner.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ultimate Humanizer banner</title>
<style>
  :root { --bg: #111318; --ink: #f3efe6; --muted: #8b8f98; --strike: #e5484d; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 96px; gap: 28px;
    font-family: Georgia, "Times New Roman", serif;
  }
  .mono { font-family: Consolas, "Cascadia Mono", monospace; }
  .label { font-size: 22px; color: var(--muted); letter-spacing: 0.04em; }
  h1 { font-size: 104px; font-weight: 400; line-height: 1; letter-spacing: -0.01em; }
  .sub { font-size: 30px; line-height: 1.35; max-width: 1000px; }
  .tells { display: flex; flex-wrap: wrap; gap: 14px 28px; font-size: 22px; color: var(--muted); }
  .tells span { text-decoration: line-through; text-decoration-color: var(--strike); text-decoration-thickness: 2px; }
  .url { font-size: 22px; color: var(--muted); }
  /* README banner: short canvas, title and struck tells only */
  @media (max-height: 400px) {
    body { gap: 22px; }
    .label, .sub, .url { display: none; }
    h1 { font-size: 92px; }
  }
</style>
</head>
<body>
  <div class="label mono">Claude Code skill</div>
  <h1>Ultimate Humanizer</h1>
  <p class="sub">Keeps AI writing tells out of your text. 91 rules from Wikipedia's field guide, plus a linter that catches the mechanical ones.</p>
  <div class="tells mono">
    <span>delve</span><span>tapestry</span><span>pivotal</span><span>It's not just X, it's Y</span><span>I hope this helps!</span><span>In conclusion,</span>
  </div>
  <div class="url mono">github.com/DrARaj/ultimate-humanizer</div>
</body>
</html>
