[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-humanizer"
version = "1.1.4"
description = "Writing-style rules and a linter that flags phrasing habits common in AI-generated prose. It does not detect authorship."
readme = "README.md"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "DrARaj" }]
requires-python = ">=3.8"
keywords = ["ai-writing", "claude-code", "linter", "writing", "writing-style"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
ultimate-humanizer = "scripts.lint:main"
ai-lint = "scripts.lint:main"

[tool.setuptools]
packages = ["scripts"]
